name: PR review app

# Publishes a static preview under
# https://tbell-dsit.github.io/temp-repo/pr-preview/pr-<N>/.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prepare site
        if: github.event.action != 'closed'
        run: |
          mkdir site
          cp main.html site/index.html
          cp css.css js.js site/

      - name: Deploy / remove preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976
        with:
          source-dir: ./site/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: tbell-dsit.github.io/temp-repo
          action: auto
          wait-for-pages-deployment: true
